# Keeps the pinned action SHAs current so we never sit on a deprecated runtime
# again. Dependabot understands `uses: owner/repo@<sha> # vN` and bumps both the
# SHA and the comment, opening a PR that goes through review like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
