name: deploy

# Only ever runs on a push to main, which only happens through a reviewed and
# merged pull request. It never runs on `pull_request`, so the Cloudflare
# credentials are unreachable from a fork.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: build, verify and ship to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://morseasy.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # A red check never ships. The publish step below depends on this passing.
      - name: Build and run checks
        run: python3 scripts/check.py

      # Called directly rather than through cloudflare/wrangler-action, which
      # silently installed wrangler 3.90 and never exported the token.
      # The token is scoped to Cloudflare Pages on one account and nothing else.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=morseasy \
            --branch=main \
            --commit-dirty=true

      - name: Confirm the site is answering
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://morseasy.com/ || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::morseasy.com did not return 200 after the deploy"
          exit 1
