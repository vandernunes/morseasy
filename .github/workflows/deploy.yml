name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: build, verify and ship to Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://morseasy.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A red check never ships. The deploy depends on this step passing.
      - name: Build and run checks
        run: python3 scripts/check.py

      # Called directly rather than through cloudflare/wrangler-action, which
      # silently installed wrangler 3.90 and never exported the token.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name=morseasy \
            --branch=main \
            --commit-dirty=true

      - name: Confirm the site is answering
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://morseasy.com/ || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::morseasy.com did not return 200 after the deploy"
          exit 1
