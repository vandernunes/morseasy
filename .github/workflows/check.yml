name: check

# Runs on every branch and every pull request, including pull requests from
# forks. It deliberately uses NO secrets, so a fork PR can never reach a
# credential through this workflow.
on:
  pull_request:
  push:
    branches-ignore: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. A tag can be
      # repointed by whoever owns the action; a SHA cannot. The trailing comment
      # records which major each SHA is, so upgrades stay readable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Build and run checks
        run: python3 scripts/check.py

      - name: Upload built page
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: morseasy-dist
          path: dist/
          retention-days: 7
